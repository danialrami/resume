# site.yaml — cross-cutting config shared across all lenses.
# One edit here propagates through the build; keeps the per-lens data files clean.

# The three real, deep-linkable routes. Slugs are deep-linked and shared, so a
# rename is a coordinated change: update SWITCH_LINKS in scripts/render_html.py in
# the SAME commit, and confirm no external referrer hardcodes the old slug.
lenses:
  - slug: ""              # "/" — synthesis / cold-landing (third lens intentionally unnamed)
    data: resume.root.yaml
    nav_label: Overview
  - slug: audio           # /audio — audio & interactive-sound lens (formerly /sound-design)
    data: resume.yaml
    nav_label: Audio
  - slug: infra           # /infra — infrastructure-engineering lens
    data: resume.infra.yaml
    nav_label: Infrastructure

# Deck download. Ships via Google Drive now (zero infra); swap to the branded
# R2 URL (e.g. https://dl.daniel-ramirez.io/Ramirez-Daniel_deck.pdf) later by
# changing ONLY the download_url value below.
deck:
  # Direct-download form of Daniel's shared Drive file — same file id,
  # same "anyone with the link" perms, but downloads instead of opening a preview.
  download_url: "https://drive.usercontent.google.com/download?id=14NlocpvsWC1MLLTOTxtkdq0EZviiuj6P&export=download"
  label: "Download deck (PDF)"
  # The deck site is live, so the hero carries a "Deck" cross-link to it.
  site_url: "https://deck.daniel-ramirez.io"

# Cross-links to the sibling daniel-ramirez.io sites. Empty url = link hidden.
links:
  blog:
    url: "https://blog.daniel-ramirez.io"
    label: "Blog"

# Resume PDF. Intentionally EMPTY: /assets/pdf/resume.pdf does not exist — the
# host answers it with the SPA shell (a soft 404), so a button here would look
# fine and be broken. Set the url once a real PDF ships and it appears in the
# hero beside Contact; until then the button simply isn't rendered.
resume_pdf:
  url: ""
  label: "Download PDF"

# Certifications, shared by every lens (a lens may still declare its own to
# override). `status: earned` renders as a filled "Certified" chip and sorts
# first; anything else renders as "In progress". `short` is the compact form
# used in the front-matter band under the hero.
certifications:
  - name: Wwise Certification
    short: Wwise
    issuer: Audiokinetic
    status: earned
  - name: Unreal Engine 5
    short: UE5
    issuer: School of Video Game Audio
    status: earned
  - name: CompTIA A+
    issuer: ACI Learning
    status: in-progress
  - name: CompTIA Network+
    issuer: ACI Learning
    status: in-progress
  - name: CompTIA Security+
    issuer: ACI Learning
    status: in-progress
  - name: Q-SYS
    issuer: QSC
    status: in-progress
  - name: Dante Certification
    issuer: Audinate
    status: in-progress

# The rail's viz caption. Plain text on purpose — it names the source of the
# audio, it is not a link.
viz_tag: "catalog.lufs.audio"

# lufs-vh verification mark — ONE file, one payload, two jobs.
#
# The same mark is the footer stamp and the favicon, so the tab icon and the
# seal at the bottom of the page are literally the same image at two sizes.
#
#   node cli.ts render "https://resume.daniel-ramirez.io/" \
#        -S ring-68 -F scope -P dr-muted -o vh-resume-ring.svg
#
# sha256  671a449392c27ce0e997a944729afd8c039c704a92822f0af9f68680db02d007
# ring-68 carries the first 14 bytes of that digest. It verifies:
#   node cli.ts attest <file.png> "https://resume.daniel-ramirez.io/" -> exit 0
# and attesting it against any OTHER url exits 5, so the mark is bound to this
# site rather than being decoration that happens to look technical.
#
# Transparent (the tool's default) so one file composites onto BOTH themes.
# Do not hand-edit or redraw: `attest` re-derives the mark from the URL and
# compares bytes, and that check is the only thing that makes it mean anything.
# If the canonical URL changes, re-render — never patch.
visual_hash:
  mark: "/vh-resume-ring.svg"
  alt: "lufs-vh verification mark for resume.daniel-ramirez.io"
