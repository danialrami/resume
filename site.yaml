schema_version: 1
site_id: resume-danialrami
# Production hostname (confirmed 2026-07-24). canonical_url is metadata only —
# build/verify/publish are host-neutral and never read it.
canonical_url: https://resume.daniel-ramirez.io
source:
  repository: lufs-audio/resume
  production_ref: main
build:
  # HTML-only, pure-Python build. LaTeX/PDF is archived; audio streams from
  # catalog.lufs.audio at runtime — so NO ffmpeg and NO texlive are needed.
  command: bash scripts/build
  output_dir: dist/html
  toolchain:
    python: "3"
    package_manager: pip
  lockfiles:
    - requirements.txt
runtime:
  kind: static
  index: index.html
  # No custom 404 page is emitted; unknown paths fall through to the host default.
  error_document: index.html
  spa_fallback: false
  max_asset_bytes: 26214400
routes:
  required:
    - /
    - /audio/
    - /infra/
# Cache policy. NOTHING here is content-hashed, so every asset is a MUTABLE path
# that must stay in lockstep with the HTML referencing it. The host default was
# caching /styles.css for 4 hours while the HTML revalidated on every request —
# so for up to 4h after a deploy a returning visitor got NEW markup against OLD
# CSS. That is an observed layout break, not a theoretical one. Revalidate
# everything; ETags make that a cheap 304 rather than a re-download. If these
# ever get content-hashed filenames, THEN they can be cached immutably.
# scripts/render_html.py generates dist/html/_headers from this block; this
# stays the authoritative, host-neutral declaration.
headers:
  - path: /*.html
    cache_control: "public, max-age=0, must-revalidate"
  - path: /styles.css
    cache_control: "public, max-age=0, must-revalidate"
  - path: /*.svg
    cache_control: "public, max-age=0, must-revalidate"
# The site renders fully without these; they are runtime enhancements only.
external_origins:
  - id: catalog-audio
    url: https://catalog.lufs.audio
    required: false
  - id: google-fonts
    url: https://fonts.googleapis.com
    required: false
  - id: deck-download
    url: https://drive.usercontent.google.com
    required: false
domains:
  - resume.daniel-ramirez.io
release:
  # CI publishes the verified artifact to the agnostic `site` branch; any host
  # (Cloudflare Pages git-integration, or a Hostinger webhook) consumes it as a
  # swappable adapter. Cloudflare Pages: production branch = site, build command
  # empty, output dir = "/" (serve the prebuilt files as-is).
  artifact_name: site.tar.gz
  publish_branch: site
  retain: 20
verification:
  content_probe: /index.html
  smoke_timeout_seconds: 10
